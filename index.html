    <script>
      (function() {
        // 1. Check URL query parameter first (?theme=dark or ?theme=light)
        const params = new URLSearchParams(window.location.search);
        let theme = params.get('theme');

        // 2. Fall back to shared cookie or localStorage if no URL parameter is present
        if (!theme) {
          const match = document.cookie.match(/(^|;)\s*theme\s*=\s*([^;]+)/);
          theme = match ? match[2] : (localStorage.getItem('theme') || (localStorage.getItem('signallab_theme_dark') === 'true' ? 'dark' : null));
        }

        // 3. Default to 'light' if not specified
        theme = (theme === 'dark') ? 'dark' : 'light';

        // 4. Apply immediately to prevent flash of wrong theme
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.classList.toggle('dark', theme === 'dark');
        try {
          localStorage.setItem('theme', theme);
          localStorage.setItem('signallab_theme_dark', String(theme === 'dark'));
          document.cookie = 'theme=' + theme + '; domain=.majn35.ir; path=/; max-age=31536000; SameSite=Lax';
          document.cookie = 'theme=' + theme + '; path=/; max-age=31536000; SameSite=Lax';
        } catch (e) {}

        document.addEventListener('DOMContentLoaded', function() {
          document.body.setAttribute('data-theme', theme);
          localStorage.setItem('theme', theme);
        });
      })();
    </script>
